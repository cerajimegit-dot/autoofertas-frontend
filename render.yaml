# Render Blueprint para el frontend (static site)
# El proyecto es no-build (Babel standalone + Tailwind CDN), entonces no hay paso de build.
# Los static sites:
#   - se sirven desde un CDN global (no admite `region`)
#   - son gratis siempre (no admite `plan: free` — Render lo rechaza explícitamente)
services:
  - type: web
    name: playa-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
