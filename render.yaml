# Render Blueprint para el frontend (static site)
# El proyecto es no-build (Babel standalone + Tailwind CDN), entonces no hay paso de build.
services:
  - type: web
    name: playa-frontend
    env: static
    # Los static sites de Render se sirven desde un CDN global (no admite
    # `region`). El backend sí está en virginia para latencia con Supabase.
    plan: free
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
