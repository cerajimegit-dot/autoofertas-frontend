<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playas de Autos - Sistema de Gestión</title>

    <!-- Configuracion runtime (URL del backend) — editable sin reconstruir -->
    <script src="config.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- React y ReactDOM desde CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- React Router (v5 — tiene UMD funcional; v6 no ofrece UMD) -->
    <script src="https://unpkg.com/react-router@5.3.4/umd/react-router.min.js"></script>
    <script src="https://unpkg.com/react-router-dom@5.3.4/umd/react-router-dom.min.js"></script>
    
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- SheetJS (xlsx) — para exportar Excel desde el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            /* Colores de marca — editables sin recompilar para customizar por empresa */
            --brand-primary: #2563eb;        /* azul de marca */
            --brand-primary-hover: #1d4ed8;
            --brand-secondary: #0d9488;      /* verde teal */
            --brand-accent: #f59e0b;
            --brand-logo: '🚗';
            --brand-name: 'Playas de Autos';

            /* Compatibilidad con variables previas */
            --primary: var(--brand-primary);
            --secondary: var(--brand-secondary);
            --danger: #ef4444;
            --warning: var(--brand-accent);
            --dark: #1f2937;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slide-in {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .animate-slide-in { animation: slide-in 200ms ease-out; }

        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    
    <!-- Scripts de la aplicación -->
    <script type="text/babel" src="src/utils/api.js"></script>
    <script type="text/babel" src="src/utils/auth.js"></script>
    <script type="text/babel" src="src/utils/storage.js"></script>
    <script type="text/babel" src="src/utils/format.js"></script>
    <script type="text/babel" src="src/context/AuthContext.jsx"></script>
    <script type="text/babel" src="src/context/BranchContext.jsx"></script>
    <script type="text/babel" src="src/components/Toast.jsx"></script>
    <script type="text/babel" src="src/components/EmptyState.jsx"></script>
    <script type="text/babel" src="src/components/Skeleton.jsx"></script>
    <script type="text/babel" src="src/components/Badge.jsx"></script>
    <script type="text/babel" src="src/components/ResponsiveTable.jsx"></script>
    <script type="text/babel" src="src/components/FormField.jsx"></script>
    <script type="text/babel" src="src/components/KeyboardShortcuts.jsx"></script>
    <script type="text/babel" src="src/components/Navbar.jsx"></script>
    <script type="text/babel" src="src/components/Sidebar.jsx"></script>
    <script type="text/babel" src="src/components/Card.jsx"></script>
    <script type="text/babel" src="src/components/Button.jsx"></script>
    <script type="text/babel" src="src/pages/Login.jsx"></script>
    <script type="text/babel" src="src/pages/Dashboard.jsx"></script>
    <script type="text/babel" src="src/pages/Vehicles.jsx"></script>
    <script type="text/babel" src="src/pages/Sales.jsx"></script>
    <script type="text/babel" src="src/pages/Quotas.jsx"></script>
    <script type="text/babel" src="src/pages/Customers.jsx"></script>
    <script type="text/babel" src="src/pages/CustomerDetail.jsx"></script>
    <script type="text/babel" src="src/pages/Cash.jsx"></script>
    <script type="text/babel" src="src/pages/Users.jsx"></script>
    <script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
