<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playas de Autos - Sistema de Gestión</title>

    <!-- Configuracion runtime (URL del backend) — editable sin reconstruir -->
    <script src="config.js?v=DEV"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- React y ReactDOM desde CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- React Router (v5 — tiene UMD funcional; v6 no ofrece UMD) -->
    <script src="https://unpkg.com/react-router@5.3.4/umd/react-router.min.js"></script>
    <script src="https://unpkg.com/react-router-dom@5.3.4/umd/react-router-dom.min.js"></script>
    
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- SheetJS (xlsx) — para exportar Excel desde el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            /* Colores de marca — AUTO OFERTAS usa rojo del logo.
               Editables sin recompilar para customizar por empresa. */
            --brand-primary: #dc2626;        /* rojo del logo (Tailwind red-600) */
            --brand-primary-hover: #b91c1c;  /* hover más oscuro (red-700) */
            --brand-secondary: #0d9488;      /* verde teal — secundario */
            --brand-accent: #f59e0b;         /* naranja para alertas */
            --brand-logo: '🚗';
            --brand-name: 'AUTO OFERTAS';

            /* Compatibilidad con variables previas */
            --primary: var(--brand-primary);
            --secondary: var(--brand-secondary);
            --danger: #ef4444;
            --warning: var(--brand-accent);
            --dark: #1f2937;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(220, 38, 38, 0.25);  /* rojo de marca, opaco */
            border-radius: 50%;
            border-top-color: #dc2626;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slide-in {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .animate-slide-in { animation: slide-in 200ms ease-out; }

        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* ========== PRINT STYLES ==========
           Ocultan la UI (navbar, sidebar, botones) y muestran solo
           `.print-only` en blanco/negro estilo A4. Cada página que
           necesite imprimir renderiza su template con class="print-only".
        */
        .print-only { display: none; }
        @media print {
            body {
                background: white !important;
                font-size: 10pt;
                color: black;
            }
            .no-print, nav, aside, .navbar, .sidebar,
            button, .print-hide {
                display: none !important;
            }
            .print-only { display: block !important; }
            main { padding: 0 !important; margin: 0 !important; }
            @page { size: A4; margin: 1.5cm; }
            /* Fondos rojos pasan a blanco con borde negro (tinta) */
            .bg-red-600, .bg-red-500, .bg-red-100 {
                background: white !important;
                color: black !important;
            }
            table { border-collapse: collapse; width: 100%; }
            th, td { border: 1px solid #333; padding: 4px 6px; text-align: left; }
            th { background: #f0f0f0 !important; font-weight: bold; }
            .avoid-break { page-break-inside: avoid; }
            h1, h2, h3 { page-break-after: avoid; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    
    <!-- Scripts de la aplicación -->
    <!-- El ?v=DEV se reemplaza automáticamente por timestamp del deploy en render.yaml
         para forzar cache-bust del browser y del CDN. En local siempre queda DEV. -->

    <script type="text/babel" src="src/pages/Login.jsx?v=DEV"></script>
